[package]
name = "rastok"
description = "Typed graph runtime for stateful, effectful integrations"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = []
# Hosted networking is a static assembly choice. Keeping the three physical
# capabilities separate lets minimal builds omit BoringSSL, Hyper or the
# WebSocket codec without changing a semantic Connector id.
hosted-network = ["hosted-http12", "hosted-http3", "hosted-websocket"]
# The local debugger is a separate static capability: hosted deployments may
# include it without any Connector family, while minimal/embedded images pay
# for neither its HTTP server nor its assets.
hosted-ui = [
    "dep:bytes",
    "dep:getrandom",
    "dep:http",
    "dep:http-body-util",
    "dep:hyper",
    "hyper/http1",
    "hyper/server",
    "dep:hyper-util",
    "hyper-util/tokio",
    "dep:tokio",
    "tokio/macros",
    "tokio/net",
    "tokio/rt",
    "tokio/sync",
    "tokio/time",
]
hosted-http12 = [
    "dep:bytes",
    "dep:http",
    "dep:http-body-util",
    "dep:hyper",
    "hyper/client",
    "hyper/http1",
    "hyper/http2",
    "hyper/server",
    "dep:hyper-util",
    "hyper-util/http1",
    "hyper-util/http2",
    "hyper-util/server",
    "hyper-util/tokio",
    "dep:rustls",
    "dep:rustls-pemfile",
    "dep:tokio",
    "tokio/io-util",
    "tokio/macros",
    "tokio/net",
    "tokio/rt",
    "tokio/sync",
    "tokio/time",
    "dep:tokio-rustls",
    "dep:webpki-root-certs",
]
hosted-http3 = [
    "dep:boring",
    "dep:http",
    "dep:quiche",
    "dep:rustls-pemfile",
    "dep:tokio",
    "tokio/io-util",
    "tokio/macros",
    "tokio/net",
    "tokio/rt",
    "tokio/sync",
    "tokio/time",
    "dep:webpki-root-certs",
]
hosted-websocket = [
    "hosted-http12",
    "dep:futures-util",
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:tungstenite",
]

[dependencies]
blake3 = { workspace = true, features = ["std"] }
rastok-core = { path = "../rastok-core" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
serde_yaml_ng = "=0.10.0"
boring = { version = "=4.22.0", optional = true }
bytes = { version = "=1.12.1", optional = true }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"], optional = true }
getrandom = { version = "=0.4.3", optional = true }
http-body-util = { version = "=0.1.5", optional = true }
http = { version = "=1.5.0", optional = true }
hyper = { version = "=1.11.0", default-features = false, optional = true }
hyper-util = { version = "=0.1.20", default-features = false, optional = true }
quiche = { version = "=0.29.3", default-features = false, features = ["boringssl-boring-crate"], optional = true }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-pemfile = { version = "=2.2.0", optional = true }
tokio = { version = "=1.53.1", default-features = false, optional = true }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"], optional = true }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"], optional = true }
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"], optional = true }
webpki-root-certs = { version = "=1.0.9", optional = true }

[lints]
workspace = true
