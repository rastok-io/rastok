818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="406.15" y="111.023" fill="#000" font-size="14" textLength="59.274">compiler</text><text x="406.15" y="127.512" fill="#000" font-size="14" textLength="192.445">syntax / HIR / check / lower</text><text x="406.15" y="144" fill="#000" font-size="14" textLength="243.694">Dispatch, routing, Extension checks</text></g><!--entity CATALOG--><g class="entity" data-qualified-name="HOSTED.CATALOG" id="ent0004" data-source-line="10"><rect x="694.6" y="87.488" width="278.809" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="704.6" y="111.023" fill="#000" font-size="14" textLength="109.854">contract / stdlib</text><text x="704.6" y="127.512" fill="#000" font-size="14" textLength="254.317">ContractCatalog / ConnectorContract</text><text x="704.6" y="144" fill="#000" font-size="14" textLength="258.809">six @2 sheets plus Process service @3</text></g><!--entity SCHEMA--><g class="entity" data-qualified-name="HOSTED.SCHEMA" id="ent0005" data-source-line="11"><rect x="30.77" y="380.908" width="304.45" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="40.77" y="404.443" fill="#000" font-size="14" textLength="198.229">schema_projection / openapi</text><text x="40.77" y="420.932" fill="#000" font-size="14" textLength="284.45">strict JSON Schema, Avro, Arrow, OpenAPI</text><text x="40.77" y="437.42" fill="#000" font-size="14" textLength="196.267">generated-source ownership</text></g><!--entity DRIVERS--><g class="entity" data-qualified-name="HOSTED.DRIVERS" id="ent0006" data-source-line="12"><rect x="420.32" y="217.958" width="319.366" height="85.953" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="430.32" y="241.493" fill="#000" font-size="14" textLength="74.819">connectors</text><text x="430.32" y="257.982" fill="#000" font-size="14" textLength="226.666">DriverRegistry / RuntimeBindings</text><text x="430.32" y="274.47" fill="#000" font-size="14" textLength="299.366">Process job / service, File, HTTP, WebSocket</text><text x="430.32" y="290.958" fill="#000" font-size="14" textLength="296.372">bounded physical pumps; no DSL in Drivers</text></g><!--entity CONFIG--><g class="entity" data-qualified-name="HOSTED.CONFIG" id="ent0007" data-source-line="13"><rect x="30.82" y="226.198" width="354.366" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="40.82" y="249.733" fill="#000" font-size="14" textLength="129.562">deployment_config</text><text x="40.82" y="266.222" fill="#000" font-size="14" textLength="334.366">profile JSON; explicit environment/provider input</text><text x="40.82" y="282.71" fill="#000" font-size="14" textLength="274.894">no clear credentials in semantic artifacts</text></g><!--entity LAB--><g class="entity" data-qualified-name="HOSTED.LAB" id="ent0008" data-source-line="14"><rect x="775.14" y="226.198" width="233.726" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="785.14" y="249.733" fill="#000" font-size="14" textLength="125.187">lab / conformance</text><text x="785.14" y="266.222" fill="#000" font-size="14" textLength="213.726">ScenarioRun; controlled Drivers</text><text x="785.14" y="282.71" fill="#000" font-size="14" textLength="201.64">same VM and exact Contracts</text></g><!--entity UI--><g class="entity" data-qualified-name="HOSTED.UI" id="ent0009" data-source-line="15"><rect x="370" y="380.908" width="330.003" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="380" y="404.443" fill="#000" font-size="14" textLength="115.493">ui / observability</text><text x="380" y="420.932" fill="#000" font-size="14" textLength="272.323">simulation / recorded-history debugger</text><text x="380" y="437.42" fill="#000" font-size="14" textLength="310.003">read-only prefix; never-block structured logs</text></g><!--entity GOLDEN--><g class="entity" data-qualified-name="HOSTED.GOLDEN" id="ent0010" data-source-line="16"><rect x="735.46" y="380.908" width="325.081" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="745.46" y="404.443" fill="#000" font-size="14" textLength="128.181">golden / recording</text><text x="745.46" y="420.932" fill="#000" font-size="14" textLength="305.081">Trace / Divergence; diagnostic record/replay</text><text x="745.46" y="437.42" fill="#000" font-size="14" textLength="277.348">immutable capture, not durable recovery</text></g><!--entity NODE--><g class="entity" data-qualified-name="CORE.NODE" id="ent0012" data-source-line="20"><rect x="357.55" y="566.368" width="262.895" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="367.55" y="589.903" fill="#000" font-size="14" textLength="117.783">node / connector</text><text x="367.55" y="606.392" fill="#000" font-size="14" textLength="238.807">Path, Port, Kind, Extension, Trigger</text><text x="367.55" y="622.88" fill="#000" font-size="14" textLength="242.895">ContractId, roles, exchange profiles</text></g><!--entity DATA--><g class="entity" data-qualified-name="CORE.DATA" id="ent0013" data-source-line="21"><rect x="655.14" y="566.368" width="239.728" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="665.14" y="589.903" fill="#000" font-size="14" textLength="187.38">datatype / value / envelope</text><text x="665.14" y="606.392" fill="#000" font-size="14" textLength="219.728">DataType, Value, Envelope, Data</text><text x="665.14" y="622.88" fill="#000" font-size="14" textLength="216.036">one logical type/value authority</text></g><!--entity EXPR--><g class="entity" data-qualified-name="CORE.EXPR" id="ent0014" data-source-line="22"><rect x="930.15" y="566.368" width="315.695" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.