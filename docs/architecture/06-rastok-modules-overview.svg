75.5" y="736.862" fill="#000" font-size="14" textLength="296.386">HandlerExecutor, Vm, Mailboxes, Scheduler</text><text x="975.5" y="753.35" fill="#000" font-size="14" textLength="319.006">command manager; spatial/exchange recovery</text><text x="975.5" y="769.838" fill="#000" font-size="14" textLength="226.058">Graph has no application handler</text></g><!--entity BOUNDARY--><g class="entity" data-qualified-name="CORE.BOUNDARY" id="ent0018" data-source-line="26"><rect x="233.72" y="843.788" width="306.569" height="85.953" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="243.72" y="867.323" fill="#000" font-size="14" textLength="64.374">boundary</text><text x="243.72" y="883.812" fill="#000" font-size="14" textLength="217.075">Inbound/Outbound Driver traits</text><text x="243.72" y="900.3" fill="#000" font-size="14" textLength="264.906">Intent, Completion, CallRef, SessionRef</text><text x="243.72" y="916.788" fill="#000" font-size="14" textLength="286.569">Dispatcher and Contract completion gates</text></g><!--entity JOURNAL--><g class="entity" data-qualified-name="CORE.JOURNAL" id="ent0019" data-source-line="27"><rect x="575.21" y="843.788" width="321.574" height="85.953" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="585.21" y="867.323" fill="#000" font-size="14" textLength="267.278">journal / loop_protocol / instance_stop</text><text x="585.21" y="883.812" fill="#000" font-size="14" textLength="193.286">Journal, MemJournal, Record</text><text x="585.21" y="900.3" fill="#000" font-size="14" textLength="266.745">run and exact-instance command facts</text><text x="585.21" y="916.788" fill="#000" font-size="14" textLength="301.574">retained original deadlines; no disk backend</text></g><!--entity POLICY--><g class="entity" data-qualified-name="CORE.POLICY" id="ent0020" data-source-line="28"><rect x="931.88" y="852.038" width="290.231" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="941.88" y="875.573" fill="#000" font-size="14" textLength="224.547">schema_annotation / data_policy</text><text x="941.88" y="892.062" fill="#000" font-size="14" textLength="264.12">canonical SchemaPath and five policies</text><text x="941.88" y="908.55" fill="#000" font-size="14" textLength="270.231">independent propagation and redaction</text></g><!--entity DEPLOY--><g class="entity" data-qualified-name="CORE.DEPLOY" id="ent0021" data-source-line="29"><rect x="243.62" y="990.748" width="286.759" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="253.62" y="1014.283" fill="#000" font-size="14" textLength="80.179">deployment</text><text x="253.62" y="1030.772" fill="#000" font-size="14" textLength="266.759">BootReference, BootBindings, SecretRef</text><text x="253.62" y="1047.26" fill="#000" font-size="14" textLength="257.161">run-scoped privacy/price attestations</text></g><!--entity REPORT--><g class="entity" data-qualified-name="CORE.REPORT" id="ent0022" data-source-line="30"><rect x="565.7" y="990.748" width="318.607" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="575.7" y="1014.283" fill="#000" font-size="14" textLength="170.577">observation / accounting</text><text x="575.7" y="1030.772" fill="#000" font-size="14" textLength="220.753">RecordObservation / CostReport</text><text x="575.7" y="1047.26" fill="#000" font-size="14" textLength="298.607">exact decimals, currency and unpriced facts</text></g><!--link ENTRY to COMP--><!--link COMP to CATALOG--><!--link ENTRY to CONFIG--><!--link CONFIG to DRIVERS--><!--link DRIVERS to LAB--><!--link CONFIG to SCHEMA--><!--link SCHEMA to UI--><!--link UI to GOLDEN--><!--link GOLDEN to NODE--><!--link NODE to DATA--><!--link DATA to EXPR--><!--link NODE to IDENTITY--><!--link IDENTITY to PLAN--><!--link PLAN to VM--><!--link IDENTITY to BOUNDARY--><!--link BOUNDARY to JOURNAL--><!--li