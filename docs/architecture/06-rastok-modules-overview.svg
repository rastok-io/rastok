:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="403.15" y="111.023" fill="#000" font-size="14" textLength="59.274">compiler</text><text x="403.15" y="127.512" fill="#000" font-size="14" textLength="192.445">syntax / HIR / check / lower</text><text x="403.15" y="144" fill="#000" font-size="14" textLength="243.694">Dispatch, routing, Extension checks</text></g><!--entity CATALOG--><g class="entity" data-qualified-name="HOSTED.CATALOG" id="ent0004" data-source-line="10"><rect x="692.09" y="87.488" width="357.812" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="702.09" y="111.023" fill="#000" font-size="14" textLength="109.854">contract / stdlib</text><text x="702.09" y="127.512" fill="#000" font-size="14" textLength="254.317">ContractCatalog / ConnectorContract</text><text x="702.09" y="144" fill="#000" font-size="14" textLength="337.812">Process job @4 / service @5; File and network @3</text></g><!--entity SCHEMA--><g class="entity" data-qualified-name="HOSTED.SCHEMA" id="ent0005" data-source-line="11"><rect x="30.77" y="380.908" width="304.45" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="40.77" y="404.443" fill="#000" font-size="14" textLength="198.229">schema_projection / openapi</text><text x="40.77" y="420.932" fill="#000" font-size="14" textLength="284.45">strict JSON Schema, Avro, Arrow, OpenAPI</text><text x="40.77" y="437.42" fill="#000" font-size="14" textLength="196.267">generated-source ownership</text></g><!--entity DRIVERS--><g class="entity" data-qualified-name="HOSTED.DRIVERS" id="ent0006" data-source-line="12"><rect x="420.32" y="217.958" width="319.366" height="85.953" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="430.32" y="241.493" fill="#000" font-size="14" textLength="74.819">connectors</text><text x="430.32" y="257.982" fill="#000" font-size="14" textLength="226.666">DriverRegistry / RuntimeBindings</text><text x="430.32" y="274.47" fill="#000" font-size="14" textLength="299.366">Process job / service, File, HTTP, WebSocket</text><text x="430.32" y="290.958" fill="#000" font-size="14" textLength="282.912">bounded Driver polling; no DSL in Drivers</text></g><!--entity CONFIG--><g class="entity" data-qualified-name="HOSTED.CONFIG" id="ent0007" data-source-line="13"><rect x="30.82" y="226.198" width="354.366" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="40.82" y="249.733" fill="#000" font-size="14" textLength="129.562">deployment_config</text><text x="40.82" y="266.222" fill="#000" font-size="14" textLength="334.366">profile JSON; explicit environment/provider input</text><text x="40.82" y="282.71" fill="#000" font-size="14" textLength="274.894">no clear credentials in semantic artifacts</text></g><!--entity LAB--><g class="entity" data-qualified-name="HOSTED.LAB" id="ent0008" data-source-line="14"><rect x="774.58" y="226.198" width="266.832" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="784.58" y="249.733" fill="#000" font-size="14" textLength="125.187">lab / conformance</text><text x="784.58" y="266.222" fill="#000" font-size="14" textLength="213.726">ScenarioRun; controlled Drivers</text><text x="784.58" y="282.71" fill="#000" font-size="14" textLength="246.832">same Execution and exact Contracts</text></g><!--entity UI--><g class="entity" data-qualified-name="HOSTED.UI" id="ent0009" data-source-line="15"><rect x="370" y="380.908" width="330.003" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="380" y="404.443" fill="#000" font-size="14" textLength="115.493">ui / observability</text><text x="380" y="420.932" fill="#000" font-size="14" textLength="272.323">simulation / recorded-history debugger</text><text x="380" y="437.42" fill="#000" font-size="14" textLength="310.003">read-only prefix; never-block structured logs</text></g><!--entity GOLDEN--><g class="entity" data-qualified-name="HOSTED.GOLDEN" id="ent0010" data-source-line="16"><rect x="735.46" y="380.908" width="325.081" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="745.46" y="404.443" fill="#000" font-size="14" textLength="128.181">golden / recording</text><text x="745.46" y="420.932" fill="#000" font-size="14" textLength="305.081">Trace / Divergence; diagnostic record/replay</text><text x="745.46" y="437.42" fill="#000" font-size="14" textLength="277.348">immutable capture, not durable recovery</text></g><!--entity NODE--><g class="entity" data-qualified-name="CORE.NODE" id="ent0012" data-source-line="20"><rect x="375.55" y="566.378" width="262.895" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="385.55" y="589.913" fill="#000" font-size="14" textLength="117.783">node / connector</text><text x="385.55" y="606.402" fill="#000" font-size="14" textLength="238.807">Path, Port, Kind, Extension, Trigger</text><text x="385.55" y="622.89" fill="#000" font-size="14" textLength="242.895">ContractId, roles, exchange profiles</text></g><!--entity DATA--><g class="entity" data-qualified-name="CORE.DATA" id="ent0013" data-source-line="21"><rect x="673.14" y="566.378" width="239.728" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="683.14" y="589.913" fill="#000" font-size="14" textLength="187.38">datatype / value / envelope</text><text x="683.14" y="606.402" fill="#000" font-size="14" textLength="219.728">DataType, Value, Envelope, Data</text><text x="683.14" y="622.89" fill="#000" font-size="14" textLength="216.036">one logical type/value authority</text></g><!--entity EXPR--><g class="entity" data-qualified-name="CORE.EXPR" id="ent0014" data-source-line="22"><rect x="948.15" y="566.378" width="315.695" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="958.15" y="589.913" fill="#000" font-size="14" textLength="126.048">expr / json / trivia</text><text x="958.15" y="606.402" fill="#000" font-size="14" textLength="176.121">Tree, Signature, EvalValue</text><text x="958.15" y="622.89" fill="#000" font-size="14" textLength="295.695">bounded pure evaluation and exact readers</text></g><!--entity IDENTITY--><g class="entity" data-qualified-name="CORE.IDENTITY" id="ent0015" data-source-line="23"><rect x="202.71" y="713.328" width="282.589" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="212.71" y="736.863" fill="#000" font-size="14" textLength="253.962">instance / canonical / canonical_cbor</text><text x="212.71" y="753.352" fill="#000" font-size="14" textLength="262.589">InstanceAddress, Segment, Generation</text><text x="212.71" y="769.84" fill="#000" font-size="14" textLength="252.314">canonical registry and byte discipline</text></g><!--entity PLAN--><g class="entity" data-qualified-name="CORE.PLAN" id="ent0016" data-source-line="24"><rect x="519.91" y="696.838" width="406.189" height="102.441" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="529.91" y="720.373" fill="#000" font-size="14" textLength="119.424">plan / loop_proof</text><text x="529.91" y="736.862" fill="#000" font-size="14" textLength="292.065">ValidatedExecutionPlan, Node / NodeIndex</text><text x="529.91" y="753.35" fill="#000" font-size="14" textLength="362.209">Graph wiring; Operator Dispatch; Connector Contract</text><text x="529.91" y="769.838" fill="#000" font-size="14" textLength="386.189">ExtensionSpec, LoopSpec/LoopExpiredOutput, RetrySpec</text><text x="529.91" y="786.327" fill="#000" font-size="14" textLength="333.566">derived execution routes; independent validation</text></g><!--entity VM--><g class="entity" data-qualified-name="CORE.VM" id="ent0017" data-source-line="25"><rect x="960.62" y="705.088" width="384.752" height="85.953" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="970.62" y="728.623" fill="#000" font-size="14" textLength="53.259">runtime</text><text x="970.62" y="745.112" fill="#000" font-size="14" textLength="364.752">Execution, TransactionPreparer, Mailboxes, Scheduler</text><text x="970.62" y="761.6" fill="#000" font-size="14" textLength="331.543">DeliveryRoutes; Loop / Retry managers; recovery</text><text x="970.62" y="778.088" fill="#000" font-size="14" textLength="226.058">Graph has no application handler</text></g><!--entity BOUNDARY--><g class="entity" data-qualified-name="CORE.BOUNDARY" id="ent0018" data-source-line="26"><rect x="87.88" y="860.278" width="322.244" height="85.953" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="97.88" y="883.813" fill="#000" font-size="14" textLength="64.374">boundary</text><text x="97.88" y="900.302" fill="#000" font-size="14" textLength="217.075">Inbound/Outbound Driver traits</text><text x="97.88" y="916.79" fill="#000" font-size="14" textLength="269.001">CallOpen, Completion, CallId, SessionId</text><text x="97.88" y="933.278" fill="#000" font-size="14" textLength="302.244">DriverPoller and Contract completion checks</text></g><!--entity JOURNAL--><g class="entity" data-qualified-name="CORE.JOURNAL" id="ent0019" data-source-line="27"><rect x="445.61" y="860.278" width="528.771" height="85.953" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="455.61" y="883.813" fill="#000" font-size="14" textLength="508.771">journal / deadline / codec / loop_protocol / retry_protocol / instance_stop</text><text x="455.61" y="900.302" fill="#000" font-size="14" textLength="193.286">Journal, MemJournal, Record</text><text x="455.61" y="916.79" fill="#000" font-size="14" textLength="392.28">runs, Held/Consumed/Published and instance commands</text><text x="455.61" y="933.278" fill="#000" font-size="14" textLength="306.435">unsealed original deadlines; no disk backend</text></g><!--entity POLICY--><g class="entity" data-qualified-name="CORE.POLICY" id="ent0020" data-source-line="28"><rect x="1008.93" y="868.528" width="402.149" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1018.93" y="892.063" fill="#000" font-size="14" textLength="224.547">schema_annotation / data_policy</text><text x="1018.93" y="908.552" fill="#000" font-size="14" textLength="382.149">SchemaPath; four standard annotations, typed metadata</text><text x="1018.93" y="925.04" fill="#000" font-size="14" textLength="270.231">independent propagation and redaction</text></g><!--entity DEPLOY--><g class="entity" data-qualified-name="CORE.DEPLOY" id="ent0021" data-source-line="29"><rect x="97.05" y="1015.478" width="303.903" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="107.05" y="1039.013" fill="#000" font-size="14" textLength="80.179">deployment</text><text x="107.05" y="1055.502" fill="#000" font-size="14" textLength="283.903">BootReference, BootBindings, SecretName</text><text x="107.05" y="1071.99" fill="#000" font-size="14" textLength="257.161">run-scoped privacy/price attestations</text></g><!--entity REPORT--><g class="entity" data-qualified-name="CORE.REPORT" id="ent0022" data-source-line="30"><rect x="436.18" y="1007.238" width="299.638" height="85.953" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="446.18" y="1030.773" fill="#000" font-size="14" textLength="170.577">observation / accounting</text><text x="446.18" y="1047.262" fill="#000" font-size="14" textLength="236.804">RecordObservation / Measurement</text><text x="446.18" y="1063.75" fill="#000" font-size="14" textLength="279.638">individual exact samples and provenance</text><text x="446.18" y="1080.238" fill="#000" font-size="14" textLength="205.974">no report or automatic pricing</text></g><!--link ENTRY to COMP--><!--lin