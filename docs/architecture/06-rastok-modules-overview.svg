:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="403.15" y="111.023" fill="#000" font-size="14" textLength="59.274">compiler</text><text x="403.15" y="127.512" fill="#000" font-size="14" textLength="192.445">syntax / HIR / check / lower</text><text x="403.15" y="144" fill="#000" font-size="14" textLength="243.694">Dispatch, routing, Extension checks</text></g><!--entity CATALOG--><g class="entity" data-qualified-name="HOSTED.CATALOG" id="ent0004" data-source-line="10"><rect x="692.09" y="87.488" width="357.812" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="702.09" y="111.023" fill="#000" font-size="14" textLength="109.854">contract / stdlib</text><text x="702.09" y="127.512" fill="#000" font-size="14" textLength="254.317">ContractCatalog / ConnectorContract</text><text x="702.09" y="144" fill="#000" font-size="14" textLength="337.812">Process job @4 / service @5; File and network @3</text></g><!--entity SCHEMA--><g class="entity" data-qualified-name="HOSTED.SCHEMA" id="ent0005" data-source-line="11"><rect x="30.77" y="380.908" width="304.45" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="40.77" y="404.443" fill="#000" font-size="14" textLength="198.229">schema_projection / openapi</text><text x="40.77" y="420.932" fill="#000" font-size="14" textLength="284.45">strict JSON Schema, Avro, Arrow, OpenAPI</text><text x="40.77" y="437.42" fill="#000" font-size="14" textLength="196.267">generated-source ownership</text></g><!--entity DRIVERS--><g class="entity" data-qualified-name="HOSTED.DRIVERS" id="ent0006" data-source-line="12"><rect x="420.32" y="217.958" width="319.366" height="85.953" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="430.32" y="241.493" fill="#000" font-size="14" textLength="74.819">connectors</text><text x="430.32" y="257.982" fill="#000" font-size="14" textLength="226.666">DriverRegistry / RuntimeBindings</text><text x="430.32" y="274.47" fill="#000" font-size="14" textLength="299.366">Process job / service, File, HTTP, WebSocket</text><text x="430.32" y="290.958" fill="#000" font-size="14" textLength="296.372">bounded physical pumps; no DSL in Drivers</text></g><!--entity CONFIG--><g class="entity" data-qualified-name="HOSTED.CONFIG" id="ent0007" data-source-line="13"><rect x="30.82" y="226.198" width="354.366" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="40.82" y="249.733" fill="#000" font-size="14" textLength="129.562">deployment_config</text><text x="40.82" y="266.222" fill="#000" font-size="14" textLength="334.366">profile JSON; explicit environment/provider input</text><text x="40.82" y="282.71" fill="#000" font-size="14" textLength="274.894">no clear credentials in semantic artifacts</text></g><!--entity LAB--><g class="entity" data-qualified-name="HOSTED.LAB" id="ent0008" data-source-line="14"><rect x="775.14" y="226.198" width="233.726" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="785.14" y="249.733" fill="#000" font-size="14" textLength="125.187">lab / conformance</text><text x="785.14" y="266.222" fill="#000" font-size="14" textLength="213.726">ScenarioRun; controlled Drivers</text><text x="785.14" y="282.71" fill="#000" font-size="14" textLength="201.64">same VM and exact Contracts</text></g><!--entity UI--><g class="entity" data-qualified-name="HOSTED.UI" id="ent0009" data-source-line="15"><rect x="370" y="380.908" width="330.003" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="380" y="404.443" fill="#000" font-size="14" textLength="115.493">ui / observability</text><text x="380" y="420.932" fill="#000" font-size="14" textLength="272.323">simulation / recorded-history debugger</text><text x="380" y="437.42" fill="#000" font-size="14" textLength="310.003">read-only prefix; never-block structured logs</text></g><!--entity GOLDEN--><g class="entity" data-qualified-name="HOSTED.GOLDEN" id="ent0010" data-source-line="16"><rect x="735.46" y="380.908" width="325.081" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="745.46" y="404.443" fill="#000" font-size="14" textLength="128.181">golden / recording</text><text x="745.46" y="420.932" fill="#000" font-size="14" textLength="305.081">Trace / Divergence; diagnostic record/replay</text><text x="745.46" y="437.42" fill="#000" font-size="14" textLength="277.348">immutable capture, not durable recovery</text></g><!--entity NODE--><g class="entity" data-qualified-name="CORE.NODE" id="ent0012" data-source-line="20"><rect x="372.55" y="566.378" width="262.895" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="382.55" y="589.913" fill="#000" font-size="14" textLength="117.783">node / connector</text><text x="382.55" y="606.402" fill="#000" font-size="14" textLength="238.807">Path, Port, Kind, Extension, Trigger</text><text x="382.55" y="622.89" fill="#000" font-size="14" textLength="242.895">ContractId, roles, exchange profiles</text></g><!--entity DATA--><g class="entity" data-qualified-name="CORE.DATA" id="ent0013" data-source-line="21"><rect x="670.14" y="566.378" width="239.728" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="680.14" y="589.913" fill="#000" font-size="14" textLength="187.38">datatype / value / envelope</text><text x="680.14" y="606.402" fill="#000" font-size="14" textLength="219.728">DataType, Value, Envelope, Data</text><text x="680.14" y="622.89" fill="#000" font-size="14" textLength="216.036">one logical type/value authority</text></g><!--entity EXPR--><g class="entity" data-qualified-name="CORE.EXPR" id="ent0014" data-source-line="22"><rect x="945.15" y="566.378" width="315.695" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="955.15" y="589.913" fill="#000" font-size="14" textLength="126.048">expr / json / trivia</text><text x="955.15" y="606.402" fill="#000" font-size="14" textLength="176.121">Tree, Signature, EvalValue</text><text x="955.15" y="622.89" fill="#000" font-size="14" textLength="295.695">bounded pure evaluation and exact readers</text></g><!--entity IDENTITY--><g class="entity" data-qualified-name="CORE.IDENTITY" id="ent0015" data-source-line="23"><rect x="208.02" y="705.078" width="273.962" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="218.02" y="728.613" fill="#000" font-size="14" textLength="253.962">instance / canonical / canonical_cbor</text><text x="218.02" y="745.102" fill="#000" font-size="14" textLength="202.187">Identity, Segment, Generation</text><text x="218.02" y="761.59" fill="#000" font-size="14" textLength="252.314">canonical registry and byte discipline</text></g><!--entity PLAN--><g class="entity" data-qualified-name="CORE.PLAN" id="ent0016" data-source-line="24"><rect x="516.61" y="696.838" width="426.779" height="85.953" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="526.61" y="720.373" fill="#000" font-size="14" textLength="119.424">plan / loop_proof</text><text x="526.61" y="736.862" fill="#000" font-size="14" textLength="278.886">ValidatedExecutionPlan, Owner, Dispatch</text><text x="526.61" y="753.35" fill="#000" font-size="14" textLength="406.779">RouteRule, ExtensionSpec, LoopSpec/LoopExpiry, RetrySpec</text><text x="526.61" y="769.838" fill="#000" font-size="14" textLength="308.745">independent scope, type and proof validation</text></g><!--entity VM--><g class="entity" data-qualified-name="CORE.VM" id="ent0017" data-source-line="25"><rect x="978.2" y="696.838" width="363.608" height="85.953" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="988.2" y="720.373" fill="#000" font-size="14" textLength="53.259">runtime</text><text x="988.2" y="736.862" fill="#000" font-size="14" textLength="296.386">HandlerExecutor, Vm, Mailboxes, Scheduler</text><text x="988.2" y="753.35" fill="#000" font-size="14" textLength="343.608">Loop / Retry managers; spatial/exchange recovery</text><text x="988.2" y="769.838" fill="#000" font-size="14" textLength="226.058">Graph has no application handler</text></g><!--entity BOUNDARY--><g class="entity" data-qualified-name="CORE.BOUNDARY" id="ent0018" data-source-line="26"><rect x="97.72" y="843.788" width="306.569" height="85.953" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="107.72" y="867.323" fill="#000" font-size="14" textLength="64.374">boundary</text><text x="107.72" y="883.812" fill="#000" font-size="14" textLength="217.075">Inbound/Outbound Driver traits</text><text x="107.72" y="900.3" fill="#000" font-size="14" textLength="246.996">Intent, Completion, CallId, SessionId</text><text x="107.72" y="916.788" fill="#000" font-size="14" textLength="286.569">Dispatcher and Contract completion gates</text></g><!--entity JOURNAL--><g class="entity" data-qualified-name="CORE.JOURNAL" id="ent0019" data-source-line="27"><rect x="439.61" y="843.788" width="528.771" height="85.953" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="449.61" y="867.323" fill="#000" font-size="14" textLength="508.771">journal / deadline / codec / loop_protocol / retry_protocol / instance_stop</text><text x="449.61" y="883.812" fill="#000" font-size="14" textLength="193.286">Journal, MemJournal, Record</text><text x="449.61" y="900.3" fill="#000" font-size="14" textLength="392.28">runs, Held/Consumed/Published and instance commands</text><text x="449.61" y="916.788" fill="#000" font-size="14" textLength="306.435">unsealed original deadlines; no disk backend</text></g><!--entity POLICY--><g class="entity" data-qualified-name="CORE.POLICY" id="ent0020" data-source-line="28"><rect x="1002.93" y="852.038" width="402.149" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1012.93" y="875.573" fill="#000" font-size="14" textLength="224.547">schema_annotation / data_policy</text><text x="1012.93" y="892.062" fill="#000" font-size="14" textLength="382.149">SchemaPath; four standard annotations, typed metadata</text><text x="1012.93" y="908.55" fill="#000" font-size="14" textLength="270.231">independent propagation and redaction</text></g><!--entity DEPLOY--><g class="entity" data-qualified-name="CORE.DEPLOY" id="ent0021" data-source-line="29"><rect x="99.05" y="998.988" width="303.903" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="109.05" y="1022.523" fill="#000" font-size="14" textLength="80.179">deployment</text><text x="109.05" y="1039.012" fill="#000" font-size="14" textLength="283.903">BootReference, BootBindings, SecretName</text><text x="109.05" y="1055.5" fill="#000" font-size="14" textLength="257.161">run-scoped privacy/price attestations</text></g><!--entity REPORT--><g class="entity" data-qualified-name="CORE.REPORT" id="ent0022" data-source-line="30"><rect x="438.18" y="990.748" width="323.646" height="85.953" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="448.18" y="1014.283" fill="#000" font-size="14" textLength="170.577">observation / accounting</text><text x="448.18" y="1030.772" fill="#000" font-size="14" textLength="303.646">RecordObservation / AccountingObservation</text><text x="448.18" y="1047.26" fill="#000" font-size="14" textLength="279.638">individual exact samples and provenance</text><text x="448.18" y="1063.748" fill="#000" font-size="14" textLength="205.974">no report or automatic pricing</text></g><!--link ENTRY to COMP--><!--link COMP to CATALOG--><!--link ENTRY to CONFIG--><!--link CONFIG to DRIVERS--><!--link DRIVERS to LAB--><!--link CONFIG to SCHEMA--><!--link SCHEMA to UI--><!--link UI to GOLDEN--><!--link GOLDEN to NODE--><!--link NODE to DATA--><!--link DATA to EXPR--><!--link NODE to IDENTITY--><!--link IDENTITY to PLAN--><!--link PLAN to VM--><!--link IDENTITY to BOUNDARY--><!--link BOUNDARY to JOURNAL--><!--link JOURNAL to POLICY--><!--link BOUNDARY to DEPLOY--><!--link DEPLOY to REPORT--><!--link HOSTED to CORE--><g class="link" data-entity-1="ent0001" data-entity-2="ent0011" id="lnk42" data-source-line="53" data-link-type="dependency"><path d="M1093.226,129.249 C1093.605,129.531 1093.997,129.823 1094.4,130.125 C1095.206,130.728 1096.061,131.369 1096.962,132.048 C1104.17,137.478 1114.358,145.319 1126.752,155.298 C1151.54,175.258 1185.153,203.773 1221.401,238.676 C1293.898,308.481 1376.935,403.833 1421,507.378 C1422.961,511.987 1424.565,516.839 1425.869,521.809 C1425.95,522.119 1426.03,522.43 1426.11,522.742 C1426.149,522.898 1424.975,518.203 1425.014,518.359" style="stroke:#181818;stroke-width:1;" fill="none" id="HOSTED-to-CORE"/><polygon points="1426.227,523.209,1427.924,513.508,1425.014,518.359,1420.163,515.449,1426.227,523.209" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1325.41" y="347.477" fill="#000" font-size="13" textLength="299.248">compile-time dependency only in this direction</text></g><g class="legend" data-source-line="55"><rect x="540.329" y="1120.698" width="552.999" height="59.465" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="545.329" y="1139.233" fill="#000" font-size="14" textLength="542.999">Module inventory and crate dependency; execution relationships are in view 03.</text><text x="545.329" y="1155.722" fill="#000" font-size="14" textLength="493.008">Core never imports compiler, Lab, browser, network libraries or OS APIs.</text><text x="545.329" y="1172.21" fill="#000" font-size="14" textLength="482.891">The shared Node/Executor model is semantic; no public Executor trait.</text></g><?plantuml-src TLVRZkEu4NttLnJcAK7aSO1DNh