818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="406.15" y="111.023" fill="#000" font-size="14" textLength="59.274">compiler</text><text x="406.15" y="127.512" fill="#000" font-size="14" textLength="192.445">syntax / HIR / check / lower</text><text x="406.15" y="144" fill="#000" font-size="14" textLength="243.694">Dispatch, routing, Extension checks</text></g><!--entity CATALOG--><g class="entity" data-qualified-name="HOSTED.CATALOG" id="ent0004" data-source-line="10"><rect x="694.94" y="87.488" width="314.123" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="704.94" y="111.023" fill="#000" font-size="14" textLength="109.854">contract / stdlib</text><text x="704.94" y="127.512" fill="#000" font-size="14" textLength="254.317">ContractCatalog / ConnectorContract</text><text x="704.94" y="144" fill="#000" font-size="14" textLength="294.123">six executable @2 sheets; frontend readers</text></g><!--entity SCHEMA--><g class="entity" data-qualified-name="HOSTED.SCHEMA" id="ent0005" data-source-line="11"><rect x="30.77" y="380.908" width="304.45" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="40.77" y="404.443" fill="#000" font-size="14" textLength="198.229">schema_projection / openapi</text><text x="40.77" y="420.932" fill="#000" font-size="14" textLength="284.45">strict JSON Schema, Avro, Arrow, OpenAPI</text><text x="40.77" y="437.42" fill="#000" font-size="14" textLength="196.267">generated-source ownership</text></g><!--entity DRIVERS--><g class="entity" data-qualified-name="HOSTED.DRIVERS" id="ent0006" data-source-line="12"><rect x="420.3" y="217.958" width="281.406" height="85.953" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="430.3" y="241.493" fill="#000" font-size="14" textLength="74.819">connectors</text><text x="430.3" y="257.982" fill="#000" font-size="14" textLength="226.666">DriverRegistry / RuntimeBindings</text><text x="430.3" y="274.47" fill="#000" font-size="14" textLength="210.137">Process, File, HTTP, WebSocket</text><text x="430.3" y="290.958" fill="#000" font-size="14" textLength="261.406">private network: bounded async pump</text></g><!--entity CONFIG--><g class="entity" data-qualified-name="HOSTED.CONFIG" id="ent0007" data-source-line="13"><rect x="30.82" y="226.198" width="354.366" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="40.82" y="249.733" fill="#000" font-size="14" textLength="129.562">deployment_config</text><text x="40.82" y="266.222" fill="#000" font-size="14" textLength="334.366">profile JSON; explicit environment/provider input</text><text x="40.82" y="282.71" fill="#000" font-size="14" textLength="274.894">no clear credentials in semantic artifacts</text></g><!--entity LAB--><g class="entity" data-qualified-name="HOSTED.LAB" id="ent0008" data-source-line="14"><rect x="737.14" y="226.198" width="233.726" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="747.14" y="249.733" fill="#000" font-size="14" textLength="125.187">lab / conformance</text><text x="747.14" y="266.222" fill="#000" font-size="14" textLength="213.726">ScenarioRun; controlled Drivers</text><text x="747.14" y="282.71" fill="#000" font-size="14" textLength="201.64">same VM and exact Contracts</text></g><!--entity UI--><g class="entity" data-qualified-name="HOSTED.UI" id="ent0009" data-source-line="15"><rect x="370.59" y="380.908" width="296.828" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="380.59" y="404.443" fill="#000" font-size="14" textLength="115.493">ui / observability</text><text x="380.59" y="420.932" fill="#000" font-size="14" textLength="276.063">simulate-only debugger; structured logs</text><text x="380.59" y="437.42" fill="#000" font-size="14" textLength="276.828">read-only prefix and never-block export</text></g><!--entity GOLDEN--><g class="entity" data-qualified-name="HOSTED.GOLDEN" id="ent0010" data-source-line="16"><rect x="702.33" y="380.908" width="327.344" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="712.33" y="404.443" fill="#000" font-size="14" textLength="46.676">golden</text><text x="712.33" y="420.932" fill="#000" font-size="14" textLength="128.98">Trace / Divergence</text><text x="712.33" y="437.42" fill="#000" font-size="14" textLength="307.344">causal projection, not full-record persistence</text></g><!--entity NODE--><g class="entity" data-qualified-name="CORE.NODE" id="ent0012" data-source-line="20"><rect x="338.55" y="566.368" width="262.895" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="348.55" y="589.903" fill="#000" font-size="14" textLength="117.783">node / connector</text><text x="348.55" y="606.392" fill="#000" font-size="14" textLength="238.807">Path, Port, Kind, Extension, Trigger</text><text x="348.55" y="622.88" fill="#000" font-size="14" textLength="242.895">ContractId, roles, exchange profiles</text></g><!--entity DATA--><g class="entity" data-qualified-name="CORE.DATA" id="ent0013" data-source-line="21"><rect x="636.14" y="566.368" width="239.728" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="646.14" y="589.903" fill="#000" font-size="14" textLength="187.38">datatype / value / envelope</text><text x="646.14" y="606.392" fill="#000" font-size="14" textLength="219.728">DataType, Value, Envelope, Data</text><text x="646.14" y="622.88" fill="#000" font-size="14" textLength="216.036">one logical type/value authority</text></g><!--entity EXPR--><g class="entity" data-qualified-name="CORE.EXPR" id="ent0014" data-source-line="22"><rect x="911.15" y="566.368" width="315.695" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="921.15" y="589.903" fill="#000" font-size="14" textLength="126.048">expr / json / trivia</text><text x="921.15" y="606.392" fill="#000" font-size="14" textLength="176.121">Tree, Signature, EvalValue</text><text x="921.15" y="622.88" fill="#000" font-size="14" textLength="295.695">bounded pure evaluation and exact readers</text></g><!--entity IDENTITY--><g class="entity" data-qualified-name="CORE.IDENTITY" id="ent0015" data-source-line="23"><rect x="208.64" y="705.078" width="314.711" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="218.64" y="728.613" fill="#000" font-size="14" textLength="168.567">identity / canonical_cbor</text><text x="218.64" y="745.102" fill="#000" font-size="14" textLength="198.714">InstanceAddress, InstanceRef</text><text x="218.64" y="761.59" fill="#000" font-size="14" textLength="294.711">tagged values and canonical byte discipline</text></g><!--entity PLAN--><g class="entity" data-qualified-name="CORE.PLAN" id="ent0016" data-source-line="24"><rect x="558.17" y="696.838" width="351.666" height="85.953" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="568.17" y="720.373" fill="#000" font-size="14" textLength="119.424">plan / loop_proof</text><text x="568.17" y="736.862" fill="#000" font-size="14" textLength="278.886">ValidatedExecutionPlan, Owner, Dispatch</text><text x="568.17" y="753.35" fill="#000" font-size="14" textLength="331.666">RouteRule, ExtensionSpec, LoopSpec/LoopExpiry</text><text x="568.17" y="769.838" fill="#000" font-size="14" textLength="308.745">independent scope, type and proof validation</text></g><!--entity VM--><g class="entity" data-qualified-name="CORE.VM" id="ent0017" data-source-line="25"><rect x="944.5" y="696.838" width="339.006" height="85.953" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="954.5" y="720.373" fill="#000" font-size="14" textLength="53.259">runtime</text><text x="954.5" y="736.862" fill="#000" font-size="14" textLength="296.386">HandlerExecutor, Vm, Mailboxes, Scheduler</text><text x="954.5" y="753.35" fill="#000" font-size="14" textLength="319.006">command manager; spatial/exchange recovery</text><text x="954.5" y="769.838" fill="#000" font-size="14" textLength="226.058">Graph has no application handler</text></g><!--entity BOUNDARY--><g class="entity" data-qualified-name="CORE.BOUNDARY" id="ent0018" data-source-line="26"><rect x="212.72" y="843.788" width="306.569" height="85.953" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="222.72" y="867.323" fill="#000" font-size="14" textLength="64.374">boundary</text><text x="222.72" y="883.812" fill="#000" font-size="14" textLength="217.075">Inbound/Outbound Driver traits</text><text x="222.72" y="900.3" fill="#000" font-size="14" textLength="264.906">Intent, Completion, CallRef, SessionRef</text><text x="222.72" y="916.788" fill="#000" font-size="14" textLength="286.569">Dispatcher and Contract completion gates</text></g><!--entity JOURNAL--><g class="entity" data-qualified-name="CORE.JOURNAL" id="ent0019" data-source-line="27"><rect x="553.8" y="843.788" width="352.397" height="85.953" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="563.8" y="867.323" fill="#000" font-size="14" textLength="214.396">journal / journal::loop_protocol</text><text x="563.8" y="883.812" fill="#000" font-size="14" textLength="193.286">Journal, MemJournal, Record</text><text x="563.8" y="900.3" fill="#000" font-size="14" textLength="332.397">LoopRunRef, command production/consumption</text><text x="563.8" y="916.788" fill="#000" font-size="14" textLength="301.574">retained original deadlines; no disk backend</text></g><!--entity POLICY--><g class="entity" data-qualified-name="CORE.POLICY" id="ent0020" data-source-line="28"><rect x="940.88" y="852.038" width="290.231" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="950.88" y="875.573" fill="#000" font-size="14" textLength="224.547">schema_annotation / data_policy</text><text x="950.88" y="892.062" fill="#000" font-size="14" textLength="264.12">canonical SchemaPath and five policies</text><text x="950.88" y="908.55" fill="#000" font-size="14" textLength="270.231">independent propagation and redaction</text></g><!--entity DEPLOY--><g class="entity" data-qualified-name="CORE.DEPLOY" id="ent0021" data-source-line="29"><rect x="222.62" y="990.748" width="286.759" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="232.62" y="1014.283" fill="#000" font-size="14" textLength="80.179">deployment</text><text x="232.62" y="1030.772" fill="#000" font-size="14" textLength="266.759">BootReference, BootBindings, SecretRef</text><text x="232.62" y="1047.26" fill="#000" font-size="14" textLength="257.161">run-scoped privacy/price attestations</text></g><!--entity REPORT--><g class="entity" data-qualified-name="CORE.REPORT" id="ent0022" data-source-line="30"><rect x="544.7" y="990.748" width="318.607" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="554.7" y="1014.283" fill="#000" font-size="14" textLength="170.577">observation / accounting</text><text x="554.7" y="1030.772" fill="#000" font-size="14" textLength="220.753">RecordObservation / CostReport</text><text x="554.7" y="1047.26" fill="#000" font-size="14" textLength="298.607">exact decimals, currency and unpriced facts</text></g><!--link ENTRY to COMP--><!--link COMP to CATALOG--><!--link ENTRY to CONFIG--><!--link CONFIG to DRIVERS--><!--link DRIVERS to LAB--><!--link CONFIG to SCHEMA--><!--link SCHEMA to UI--><!--link UI to GOLDEN--><!--link GOLDEN to NODE--><!--link NODE to DATA--><!--link DATA to EXPR--><!--link NODE to IDENTITY--><!--link IDENTITY to PLAN--><!--link PLAN to VM--><!--link IDENTITY to BOUNDARY--><!--link BOUNDARY to JOURNAL--><!--link JOURNAL to POLICY--><!--link BOUNDARY to DEPLOY--><!--link DEPLOY to REPORT--><!--link HOSTED to CORE--><g class="link" data-entity-1="ent0001" data-entity-2="ent0011" id="lnk42" data-source-line="53" data-link-type="dependency"><path d="M1062.154,132.144 C1062.312,132.32 1062.473,132.499 1062.635,132.679 C1062.96,133.041 1063.294,133.413 1063.635,133.795 C1069.102,139.899 1076.683,148.509 1085.827,159.267 C1104.114,180.782 1128.652,210.886 1155.026,246.712 C1207.775,318.363 1267.87,412.898 1300,507.368 C1301.613,512.111 1302.952,517.065 1304.06,522.109 C1304.129,522.424 1303.153,517.85 1303.221,518.166" style="stroke:#181818;stroke-width:1;" fill="none" id="HOSTED-to-CORE"/><polygon points="1304.265,523.056,1306.297,513.419,1303.221,518.166,1298.474,515.09,1304.265,523.056" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1225.27" y="347.477" fill="#000" font-size="13" textLength="299.248">compile-time dependency only in this direction</text></g><g class="legend" data-source-line="55"><rect x="490.259" y="1104.208" width="552.999" height="59.465" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="495.259" y="1122.743" fill="#000" font-size="14" textLength="542.999">Module inventory and crate dependency; execution relationships are in view 03.</text><text x="495.259" y="1139.232" fill="#000" font-size="14" textLength="493.008">Core never imports compiler, Lab, browser, network libraries or OS APIs.</text><text x="495.259" y="1155.72" fill="#000" font-size="14" textLength="482.891">The shared Node/Executor model is semantic; no public Executor trait.</text></g><?plantuml-src TLV_ZY8t4lwVfoZjNpbTi-njf9nkHuh20jbXZm7Ki9D4nsbat0QyqzWjsyqCEaNAGzmJtfFaAxkR6M1F6j4zRTSFLttrLTa_QbC99_Qq5l9nwsnjYe4jhQEddGwguq_hVYSA-wJDbZQYzAzNAaYAhLg4Owd8AHc4sPQg4sn5mTBQXc3tL6XUqTPqWWxObmiVx2Fzxu__agoTKoPGNlj0UrlKfV8aJ47IYQ2W03u9TwJl3d_xUqRltxt_eVlk7_ZxIwVJcAOtxaNTplgW2kgHjFjAbyebFMz8UBgTBPQZ8VsdGo-Eqfkzq0RxuKI1tJtuAhO6MhJqApEOZ27frNvT7ZFojdPIaQ-4yHaPiOSbv