[workspace]
members = ["crates/rastok", "crates/rastok-core"]
resolver = "3"

[workspace.package]
# Bootstrap placeholder while publishing is disabled; not a release line.
version = "0.0.0"
edition = "2024"
authors = ["Yoann Pantic"]
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# Fixed by the identity contract (docs/spec/envelope.md §2.0): changing the
# hash would change every derived id and break replay.
# Default features off at the workspace so the kernel's no_std path is
# the baseline; the std layer re-enables what it wants.
blake3 = { version = "1", default-features = false }
# RFC media-type syntax is protocol vocabulary, not a parser Rastok should
# recreate. The crate is no_std, allocation-only, MIT licensed and forbids
# unsafe; Rastok still owns canonicalization and its logical type contract.
mediatype = { version = "=0.23.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
