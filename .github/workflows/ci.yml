# The two-machine evidence of ROADMAP.md, materialized: every push
# rebuilds the whole gate from a clean checkout on Linux and macOS.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.97.1 --component rustfmt,clippy --no-self-update
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo doc --workspace --no-deps
      - run: cargo run --quiet -- simulate examples/echo.rkg
