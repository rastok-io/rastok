# The two-machine evidence of ROADMAP.md, materialized: every push
# rebuilds the whole gate from a clean checkout on Linux and macOS.
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: test the sign-off checker
        run: node --test tools/ci/check-dco.test.mjs
      - name: check rustdoc citation links
        run: |
          node --test tools/ci/check-rustdoc-links.test.mjs
          node tools/ci/check-rustdoc-links.mjs
      - name: check every contribution commit
        # The first push of a branch has no "before" commit. Its history is
        # checked from the one documented exception, exclusive: bb1b1edb3606
        # (6 August 2026) lacks its sign-off and is kept unrewritten; every
        # later commit is signed (CONTRIBUTING.md, github-opening-checklist.md).
        env:
          DCO_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          DCO_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          DCO_EXCEPTION: bb1b1edb360690e4c90fe963e4d933f9ddf0e881
        run: |
          if [ "$DCO_BASE" = "0000000000000000000000000000000000000000" ]; then DCO_BASE="$DCO_EXCEPTION"; fi
          node tools/ci/check-dco.mjs "$DCO_BASE" "$DCO_HEAD"

  debugger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: rustup toolchain install 1.97.1 --no-self-update
      - run: cargo build -p rastok --locked --features hosted-ui
      - name: install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/rastok-browser" --no-save --ignore-scripts playwright@1.58.2
          "$RUNNER_TEMP/rastok-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: layout, editor and standalone chat probes
        run: node --test crates/rastok/src/ui/graph_layout.test.cjs editors/vscode/rastok-dsl/grammar.test.cjs examples/agent-chat.test.cjs
      - name: debugger interaction and console probes
        env:
          RASTOK_PLAYWRIGHT: ${{ runner.temp }}/rastok-browser/node_modules/playwright
          RASTOK_UI_CAPTURES: ${{ runner.temp }}/rastok-ui-captures
        run: node --test crates/rastok/src/ui/browser.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debugger-qualification
          path: ${{ runner.temp }}/rastok-ui-captures
          if-no-files-found: ignore
          retention-days: 14

  gate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.97.1 --component rustfmt,clippy --no-self-update
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: cargo doc --locked --workspace --no-deps
      - run: cargo run --locked --quiet -- simulate examples/echo.rkg

  # The kernel must stay buildable for bare metal across the three
  # portability boundaries we claim: current Arm M-profile, an older
  # no-FPU Arm baseline, and a non-Arm 32-bit ISA. An OS or architecture
  # leak into rastok-core is a build error here before it is a review
  # comment. Execution remains the separate Cortex-M33 spike below.
  no-std-frontier:
    strategy:
      matrix:
        target:
          - thumbv8m.main-none-eabihf
          - thumbv7m-none-eabi
          - riscv32imac-unknown-none-elf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.97.1 --no-self-update
      - run: rustup target add ${{ matrix.target }} --toolchain 1.97.1
      - run: cargo check --locked -p rastok-core --no-default-features --target ${{ matrix.target }}

  # The spike's proof must not rot outside the workspace: build it
  # warnings-as-errors and execute it under QEMU, asserting the
  # kernel boots, runs, and prints the SAME semantic hash as the
  # host gate.
  spike-emulated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.97.1 --no-self-update
      - run: rustup target add thumbv8m.main-none-eabihf --toolchain 1.97.1
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-arm
      - name: build (warnings are errors)
        working-directory: spikes/rp2350-emu
        run: RUSTFLAGS="-D warnings -C link-arg=-Tlink.x" cargo build --locked --release
      - name: run under QEMU
        working-directory: spikes/rp2350-emu
        run: |
          qemu-system-arm -M mps2-an505 -cpu cortex-m33 \
            -kernel target/thumbv8m.main-none-eabihf/release/rastok-spike-rp2350 \
            -nographic -monitor none -serial none \
            -semihosting-config enable=on,target=native -icount shift=0 \
            | tee spike.out
          grep -q "SPIKE_OK" spike.out
          grep -q "semantic_hash: 562396de22b068ef874b8d7273bf972ee1b08b8dcb6dab8902d6b816b1c90813" spike.out

  # The benchmark's proofs: the runner's own tests, every reference
  # solution green against its referee, and the dry rehearsal of the
  # full loop — all without any model spend.
  bench-proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.97.1 --no-self-update
      - name: runner unit tests
        working-directory: bench/vibe/runner
        run: cargo test --locked
      - name: build the CLI
        run: cargo build --locked -p rastok
      - name: every reference satisfies its referee
        run: |
          for t in bench/vibe/tasks/T*/; do
            echo "== $t"
            cargo run --locked -q -p rastok -- simulate "$t/reference.rkg" "$t/referee.rkg"
          done
      - name: dry rehearsal of the loop
        working-directory: bench/vibe
        run: |
          cargo build --locked --manifest-path runner/Cargo.toml
          ./runner/target/debug/vibe-runner --tasks tasks \
            --author canned:fixtures/dry --rastok ../../target/debug/rastok \
            --prompt prompts/v4.md --out results/ci --wave ci-dry-v19
          test "$(grep -c '"outcome":"passed"' results/ci/metrics.jsonl)" = "3"
